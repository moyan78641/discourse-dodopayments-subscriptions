      site_settings:
        categories:
          discourse_dodo_subscriptions: "Dodo Payments Subscriptions"
  site_settings:
    discourse_dodo_subscriptions_enabled: Enable Dodo Payments subscriptions.
    discourse_dodo_subscriptions_extra_nav_subscribe: Show a Subscribe link in the main navigation.
    discourse_dodo_subscriptions_api_key: Dodo Payments API key for the selected test/live environment.
    discourse_dodo_subscriptions_webhook_secret: Dodo Payments webhook signing secret for this Discourse webhook endpoint.
    discourse_dodo_subscriptions_environment: Dodo Payments environment. Use test with Dodo test API keys and live with live keys.
    discourse_dodo_subscriptions_base_url: Override the Dodo Payments API base URL. Leave blank to use test/live automatically; this is not a product ID.
    discourse_dodo_subscriptions_enable_verbose_logging: Enable verbose Dodo Payments subscription logging for debugging.
